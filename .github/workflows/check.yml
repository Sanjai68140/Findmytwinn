name: Build Birthday Finder Devvit App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate birthday dates
        run: node scripts/check-prototype.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Devvit Web client
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: findmytwinn-build
          path: dist/
      - name: Deployment note
        run: echo "Build only. Reddit authentication, playtest, installation and launch are separate."
